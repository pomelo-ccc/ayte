# Builds bao_iroh's Rust library for each desktop target and caches it on main
# so release.yml and remote.yml restore it without recompiling Rust each time.
name: bao_iroh

on:
  push:
    branches: [main]
    paths:
      - packages/bao_iroh/rust/**
      - .github/workflows/bao_iroh.yml
      - .github/actions/bao-iroh-prebuilt/**
      - .github/actions/setup-rust/**
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Build for ${{ matrix.targets }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
            lib: libbao_iroh.dylib
          - runner: windows-latest
            targets: x86_64-pc-windows-msvc
            lib: bao_iroh.dll
          - runner: windows-11-arm
            targets: aarch64-pc-windows-msvc
            lib: bao_iroh.dll
          - runner: ubuntu-22.04
            container: ubuntu:20.04
            targets: x86_64-unknown-linux-gnu
            lib: libbao_iroh.so
          - runner: ubuntu-22.04-arm
            container: ubuntu:20.04
            targets: aarch64-unknown-linux-gnu
            lib: libbao_iroh.so
    container: ${{ matrix.container }}
    steps:
      - name: Install the build's tools
        if: matrix.container
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sed -i 's#http://\(archive\|security\)\.ubuntu\.com#http://azure.archive.ubuntu.com#' \
            /etc/apt/sources.list
          for attempt in 1 2 3 4 5; do
            apt-get -o Acquire::Retries=5 update 2>&1 | tee "$RUNNER_TEMP/apt.log" || true
            grep -q '^[WE]: Failed to fetch' "$RUNNER_TEMP/apt.log" || break
            [ "$attempt" = 5 ] && exit 1
            sleep 15
          done
          apt-get -o Acquire::Retries=5 install -y build-essential ca-certificates curl git zstd
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v5
      - id: cached
        uses: ./.github/actions/bao-iroh-prebuilt
      - if: steps.cached.outputs.hit != 'true'
        uses: ./.github/actions/setup-rust
      - name: Build
        if: steps.cached.outputs.hit != 'true'
        shell: bash
        working-directory: packages/bao_iroh/rust
        env:
          TARGETS: ${{ matrix.targets }}
          LIB: ${{ matrix.lib }}
        run: |
          for target in $TARGETS; do
            cargo build --release --locked --package bao_iroh --target "$target" \
              --target-dir "$RUNNER_TEMP/target"
            mkdir -p "../build/prebuilt/$target"
            cp "$RUNNER_TEMP/target/$target/release/$LIB" "../build/prebuilt/$target/"
          done
          ls -lR ../build/prebuilt
      - if: steps.cached.outputs.hit != 'true'
        uses: ./.github/actions/bao-iroh-prebuilt
        with:
          save: true
